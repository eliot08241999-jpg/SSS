name: Compilar APK
on:
  push:
    paths: ['**.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o "$(ls *.zip | head -1)" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        working-directory: src/SSS
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SSS-APK
          path: src/SSS/app/build/outputs/apk/release/*.apk
